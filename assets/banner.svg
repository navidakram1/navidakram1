<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Sk Navid Akram — Full-Stack Developer and Founder of Rabbit Guy Ltd">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1022"/>
      <stop offset="0.55" stop-color="#0f1c40"/>
      <stop offset="1" stop-color="#16307a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f8fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f8fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5cc8ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcd8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="380" rx="28"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .drift { animation: drift 14s ease-in-out infinite alternate; }
      .drift2 { animation: drift 18s ease-in-out infinite alternate-reverse; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 84px 78px; }
      .rot { opacity: 0; animation: rot 12s linear infinite; }
      .r2 { animation-delay: 4s; }
      .r3 { animation-delay: 8s; }
      @keyframes rot { 0% { opacity: 0; } 3%, 30% { opacity: 1; } 33.3%, 100% { opacity: 0; } }
      @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-70px, 30px); } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .drift, .drift2, .blink, .pulse, .rot { animation: none; } .r1 { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <circle class="drift" cx="1010" cy="70" r="300" fill="url(#glowA)"/>
    <circle class="drift2" cx="760" cy="400" r="240" fill="url(#glowB)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>

    <!-- status chip -->
    <rect x="64" y="60" width="238" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle class="pulse" cx="84" cy="78" r="5" fill="#34d399"/>
    <text x="100" y="83" class="sans" font-size="14" font-weight="600" fill="#e6efff">Available for freelance work</text>

    <text x="62" y="176" class="sans" font-size="68" font-weight="800" letter-spacing="-2" fill="url(#name)">Sk Navid Akram</text>
    <text x="64" y="222" class="sans" font-size="24" font-weight="500" fill="#c3d4f5">Full-Stack Developer · Founder of Rabbit Guy Ltd</text>

    <text x="64" y="270" class="mono" font-size="16" fill="#7fb6ff">$ building</text>
    <g class="mono" font-size="16" fill="#ffffff">
      <text x="170" y="270" class="rot r1">SaaS platforms that bill from day one<tspan fill="#5cc8ff"> ▍</tspan></text>
      <text x="170" y="270" class="rot r2">mobile and desktop apps people keep<tspan fill="#5cc8ff"> ▍</tspan></text>
      <text x="170" y="270" class="rot r3">websites designed to convert<tspan fill="#5cc8ff"> ▍</tspan></text>
    </g>

    <!-- chips -->
    <g class="sans" font-size="14" font-weight="600" fill="#eaf2ff">
      <rect x="64" y="300" width="128" height="34" rx="17" fill="#2f8fff" fill-opacity="0.22" stroke="#5aa7ff" stroke-opacity="0.5"/>
      <text x="128" y="322" text-anchor="middle">Cork, Ireland</text>
      <rect x="204" y="300" width="172" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="290" y="322" text-anchor="middle">UK registered company</text>
      <rect x="388" y="300" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
      <text x="463" y="322" text-anchor="middle">navidakram.com</text>
    </g>

    <!-- code window -->
    <g transform="translate(790 78)">
      <rect width="346" height="224" rx="18" fill="#060b18" fill-opacity="0.72" stroke="#ffffff" stroke-opacity="0.14"/>
      <circle cx="24" cy="24" r="6" fill="#ff5f57"/><circle cx="44" cy="24" r="6" fill="#febc2e"/><circle cx="64" cy="24" r="6" fill="#28c840"/>
      <text x="322" y="29" text-anchor="end" class="mono" font-size="12" fill="#6f83ad">navid.ts</text>
      <line x1="0" y1="46" x2="346" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
      <g class="mono" font-size="14.5">
        <text x="22" y="78"><tspan fill="#c792ea">const</tspan><tspan fill="#e6efff"> navid </tspan><tspan fill="#89ddff">= {</tspan></text>
        <text x="40" y="104"><tspan fill="#82aaff">role</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#c3e88d">"Founder &amp; Dev"</tspan><tspan fill="#89ddff">,</tspan></text>
        <text x="40" y="130"><tspan fill="#82aaff">ships</tspan><tspan fill="#89ddff">: [</tspan><tspan fill="#c3e88d">"SaaS"</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#c3e88d">"Apps"</tspan><tspan fill="#89ddff">],</tspan></text>
        <text x="40" y="156"><tspan fill="#82aaff">projects</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#f78c6c">1350</tspan><tspan fill="#89ddff">,</tspan></text>
        <text x="40" y="182"><tspan fill="#82aaff">products</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#f78c6c">4</tspan><tspan fill="#89ddff">,</tspan></text>
        <text x="22" y="208" fill="#89ddff">};</text>
      </g>
    </g>
  </g>
</svg>
