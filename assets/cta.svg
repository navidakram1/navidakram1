<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" role="img" aria-label="Have a project in mind? Start a project with Rabbit Guy">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e5fe0"/><stop offset="0.6" stop-color="#2f8fff"/><stop offset="1" stop-color="#5cc8ff"/></linearGradient>
<radialGradient id="gl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.09"/></pattern>
<clipPath id="r"><rect width="1200" height="220" rx="28"/></clipPath>
<style>.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}.d{animation:d 12s ease-in-out infinite alternate}@keyframes d{to{transform:translate(-120px,20px)}}@media (prefers-reduced-motion:reduce){.d{animation:none}}</style>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="220" fill="url(#bg)"/>
<circle class="d" cx="1040" cy="40" r="260" fill="url(#gl)"/>
<rect width="1200" height="220" fill="url(#grid)"/>
<text x="64" y="98" class="s" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#ffffff">Have a project in mind?</text>
<text x="66" y="142" class="s" font-size="20" font-weight="500" fill="#e6f1ff">Websites, SaaS, apps and design from one team — with free support and updates.</text>
<rect x="874" y="78" width="262" height="64" rx="32" fill="#ffffff"/>
<text x="1005" y="118" text-anchor="middle" class="s" font-size="20" font-weight="800" fill="#0f1c40">Start a project  →</text>
</g></svg>